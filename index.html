<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Light Green Light Puzzle</title>
   
    <style>body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
    }
    
    #game-container {
        position: relative;
        width: 600px;
        height: 600px;
        background-color: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    
    #game-info {
        position: absolute;
        top: 10px;
        left: 10px;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
    }
    
    #light-status {
        font-weight: bold;
    }
    
    #puzzle-container {
        width: 100%;
        height: 100%;
        position: relative;
    }
    
    .puzzle-piece {
        position: absolute;
        background-size: 600px 600px;
        border: 1px solid #000;
        transition: all 0.3s ease;
    }
    
    #start-button {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        font-size: 16px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    
    #start-button:hover {
        background-color: #45a049;
    }
    
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-info">
            <div>Level: <span id="level">1</span></div>
            <div>Time Left: <span id="time-left">30</span>s</div>
            <div>Status: <span id="light-status">Green Light</span></div>
        </div>
        <div id="puzzle-container"></div>
        <button id="start-button">Start Game</button>
    </div>
    
    <script>const puzzleContainer = document.getElementById('puzzle-container');
        const levelElement = document.getElementById('level');
        const timeLeftElement = document.getElementById('time-left');
        const lightStatusElement = document.getElementById('light-status');
        const startButton = document.getElementById('start-button');
        
        const GRID_SIZE = 3;
        const PIECE_SIZE = 200;
        const PUZZLE_SIZE = GRID_SIZE * PIECE_SIZE;
        
        let level = 1;
        let timeLeft = 30;
        let isGreenLight = true;
        let isDragging = false;
        let selectedPiece = null;
        let timer;
        
        function createPuzzlePieces() {
            puzzleContainer.innerHTML = '';
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.style.width = `${PIECE_SIZE}px`;
                piece.style.height = `${PIECE_SIZE}px`;
                piece.style.backgroundImage = `url('https://picsum.photos/600/600?random=${level}')`;
                piece.style.backgroundPosition = `-${(i % GRID_SIZE) * PIECE_SIZE}px -${Math.floor(i / GRID_SIZE) * PIECE_SIZE}px`;
                piece.style.left = `${Math.random() * (PUZZLE_SIZE - PIECE_SIZE)}px`;
                piece.style.top = `${Math.random() * (PUZZLE_SIZE - PIECE_SIZE)}px`;
                piece.dataset.index = i;
                puzzleContainer.appendChild(piece);
        
                piece.addEventListener('mousedown', startDragging);
                piece.addEventListener('mousemove', drag);
                piece.addEventListener('mouseup', stopDragging);
            }
        }
        
        function startDragging(e) {
            if (!isGreenLight) {
                gameOver();
                return;
            }
            isDragging = true;
            selectedPiece = e.target;
            selectedPiece.style.zIndex = '10';
        }
        
        function drag(e) {
            if (!isDragging) return;
            const rect = puzzleContainer.getBoundingClientRect();
            let x = e.clientX - rect.left - PIECE_SIZE / 2;
            let y = e.clientY - rect.top - PIECE_SIZE / 2;
            x = Math.max(0, Math.min(x, PUZZLE_SIZE - PIECE_SIZE));
            y = Math.max(0, Math.min(y, PUZZLE_SIZE - PIECE_SIZE));
            selectedPiece.style.left = `${x}px`;
            selectedPiece.style.top = `${y}px`;
        }
        
        function stopDragging() {
            if (!isDragging) return;
            isDragging = false;
            selectedPiece.style.zIndex = '1';
            snapToGrid();
            checkPuzzleCompletion();
        }
        
        function snapToGrid() {
            const x = Math.round(parseInt(selectedPiece.style.left) / PIECE_SIZE) * PIECE_SIZE;
            const y = Math.round(parseInt(selectedPiece.style.top) / PIECE_SIZE) * PIECE_SIZE;
            selectedPiece.style.left = `${x}px`;
            selectedPiece.style.top = `${y}px`;
        }
        
        function checkPuzzleCompletion() {
            const pieces = document.querySelectorAll('.puzzle-piece');
            const completed = Array.from(pieces).every(piece => {
                const index = parseInt(piece.dataset.index);
                const correctX = (index % GRID_SIZE) * PIECE_SIZE;
                const correctY = Math.floor(index / GRID_SIZE) * PIECE_SIZE;
                return parseInt(piece.style.left) === correctX && parseInt(piece.style.top) === correctY;
            });
        
            if (completed) {
                level++;
                if (level > 3) {
                    alert('Congratulations! You completed all levels!');
                    resetGame();
                } else {
                    alert(`Level ${level - 1} completed! Starting level ${level}`);
                    startLevel();
                }
            }
        }
        
        function toggleLight() {
            isGreenLight = Math.random() < 0.5;
            lightStatusElement.textContent = isGreenLight ? 'Green Light' : 'Red Light';
            lightStatusElement.style.color = isGreenLight ? 'green' : 'red';
        }
        
        function updateTimer() {
            timeLeft--;
            timeLeftElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                gameOver();
            }
        }
        
        function gameOver() {
            clearInterval(timer);
            alert('Game Over! You ran out of time or moved during a red light.');
            resetGame();
        }
        
        function resetGame() {
            level = 1;
            startButton.style.display = 'block';
            puzzleContainer.innerHTML = '';
            levelElement.textContent = level;
            timeLeftElement.textContent = '30';
            lightStatusElement.textContent = 'Green Light';
            lightStatusElement.style.color = 'green';
        }
        
        function startLevel() {
            timeLeft = 30;
            isGreenLight = true;
            createPuzzlePieces();
            levelElement.textContent = level;
            timeLeftElement.textContent = timeLeft;
            lightStatusElement.textContent = 'Green Light';
            lightStatusElement.style.color = 'green';
        
            clearInterval(timer);
            timer = setInterval(() => {
                updateTimer();
                if (Math.random() < 0.1) {
                    toggleLight();
                }
            }, 1000);
        }
        
        startButton.addEventListener('click', () => {
            startButton.style.display = 'none';
            startLevel();
        });
        
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', stopDragging);
        
        resetGame();
        
        </script>
</body>
</html>
